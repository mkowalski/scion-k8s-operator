<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-return" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-blocked" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="470" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Pod traffic through the node-local SCION gateway</text>

  <!-- platform requirement -->
  <rect x="285" y="44" width="370" height="32" rx="16" fill="#fef3c7" stroke="#d97706"/>
  <text x="470" y="65" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">OVN-K requirement: routingViaHost = true</text>

  <!-- cluster node -->
  <rect x="25" y="92" width="535" height="390" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="42" y="116" font-size="13" font-weight="600" fill="#64748b">OpenShift node</text>

  <!-- pod -->
  <rect x="55" y="145" width="130" height="62" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="120" y="169" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">workload pod</text>
  <text x="120" y="189" text-anchor="middle" font-size="11" fill="#1e3a8a">10.128.2.15</text>

  <!-- OVN -->
  <rect x="225" y="137" width="145" height="78" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="297" y="162" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">OVN-Kubernetes</text>
  <text x="297" y="181" text-anchor="middle" font-size="11" fill="#92400e">ovn-k8s-mp0</text>
  <text x="297" y="198" text-anchor="middle" font-size="10" fill="#92400e">hands egress to host</text>

  <!-- Host routing -->
  <rect x="410" y="137" width="120" height="78" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="470" y="161" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">host routing</text>
  <text x="470" y="181" text-anchor="middle" font-size="10" fill="#334155">learned prefix</text>
  <text x="470" y="198" text-anchor="middle" font-size="10" fill="#334155">192.168.100.0/24</text>

  <!-- forward path arrows -->
  <line x1="185" y1="176" x2="220" y2="176" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="176" x2="405" y2="176" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="202" y="166" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">1</text>
  <text x="388" y="166" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">2</text>

  <!-- blocked shared gateway bypass -->
  <path d="M297 137 C300 104, 405 102, 455 125" fill="none" stroke="#dc2626" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow-blocked)"/>
  <line x1="367" y1="105" x2="383" y2="121" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="383" y1="105" x2="367" y2="121" stroke="#dc2626" stroke-width="2.5"/>
  <text x="374" y="87" text-anchor="middle" font-size="10" fill="#991b1b">shared-gateway bypass disabled</text>

  <!-- SNAT -->
  <rect x="350" y="255" width="180" height="75" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="440" y="278" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">SCION-owned SNAT</text>
  <text x="440" y="297" text-anchor="middle" font-size="10" fill="#991b1b">only when oif = scion0</text>
  <text x="440" y="315" text-anchor="middle" font-size="11" fill="#991b1b">pod IP &#8594; 198.18.0.1</text>
  <path d="M470 215 L470 236 Q470 250 455 252" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="485" y="241" font-size="10" font-weight="600" fill="#166534">3</text>

  <!-- agent / tun -->
  <rect x="105" y="365" width="425" height="86" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="317" y="388" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">scion-node-agent (per-node SIG)</text>
  <rect x="125" y="402" width="165" height="32" rx="5" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="207" y="422" text-anchor="middle" font-size="11" fill="#166534">scion0 &#183; 198.18.0.1/32</text>
  <rect x="305" y="402" width="205" height="32" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="4 3"/>
  <text x="407" y="416" text-anchor="middle" font-size="10" fill="#166534">advertises pod CIDR +</text>
  <text x="407" y="428" text-anchor="middle" font-size="10" fill="#166534">per-node egress /32 via SGRP</text>
  <path d="M420 330 L420 347 Q420 360 405 364" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="434" y="353" font-size="10" font-weight="600" fill="#166534">4</text>

  <!-- no underlay IP advertisement -->
  <rect x="55" y="255" width="240" height="75" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="175" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">underlay stays outside the tunnel</text>
  <text x="175" y="297" text-anchor="middle" font-size="10" fill="#64748b">node IP carries SCION UDP only</text>
  <text x="175" y="315" text-anchor="middle" font-size="10" fill="#64748b">node IP is not advertised via SGRP</text>

  <!-- AS infrastructure -->
  <rect x="595" y="150" width="145" height="245" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="667" y="174" text-anchor="middle" font-size="13" font-weight="600" fill="#5b21b6">Local SCION AS</text>
  <rect x="615" y="205" width="105" height="58" rx="7" fill="#ddd6fe" stroke="#7c3aed"/>
  <text x="667" y="228" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">border router</text>
  <text x="667" y="247" text-anchor="middle" font-size="10" fill="#5b21b6">inter-AS forwarding</text>
  <rect x="615" y="292" width="105" height="58" rx="7" fill="#ddd6fe" stroke="#7c3aed"/>
  <text x="667" y="315" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">control service</text>
  <text x="667" y="334" text-anchor="middle" font-size="10" fill="#5b21b6">gateway discovery</text>

  <!-- Agent to BR -->
  <path d="M530 407 C570 407, 572 235, 610 235" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="569" y="315" text-anchor="middle" font-size="10" font-weight="600" fill="#5b21b6" transform="rotate(-90 569 315)">5 &#183; SCION over UDP</text>

  <!-- Remote AS -->
  <rect x="775" y="150" width="140" height="245" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="845" y="174" text-anchor="middle" font-size="13" font-weight="600" fill="#5b21b6">Remote AS</text>
  <rect x="792" y="205" width="106" height="58" rx="7" fill="#ddd6fe" stroke="#7c3aed"/>
  <text x="845" y="228" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">remote SIG</text>
  <text x="845" y="247" text-anchor="middle" font-size="10" fill="#5b21b6">decapsulates IP</text>
  <rect x="792" y="292" width="106" height="58" rx="7" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="845" y="315" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">remote prefix</text>
  <text x="845" y="334" text-anchor="middle" font-size="10" fill="#1e3a8a">192.168.100.0/24</text>

  <line x1="740" y1="234" x2="787" y2="234" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="764" y="222" text-anchor="middle" font-size="10" font-weight="600" fill="#5b21b6">6</text>
  <line x1="845" y1="263" x2="845" y2="287" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="858" y="281" font-size="10" font-weight="600" fill="#166534">7</text>

  <!-- Return path -->
  <path d="M845 350 C845 470, 620 507, 480 451" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-return)"/>
  <path d="M350 421 C235 505, 45 475, 45 350 L45 176 L50 176" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-return)"/>
  <rect x="555" y="443" width="292" height="24" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="701" y="459" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">return traffic follows the advertised egress /32</text>

  <!-- legend / ownership -->
  <line x1="48" y1="515" x2="78" y2="515" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="88" y="519" font-size="10" fill="#475569">inner IP forward path</text>
  <line x1="230" y1="515" x2="260" y2="515" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="270" y="519" font-size="10" fill="#475569">SCION-encapsulated UDP</text>
  <line x1="450" y1="515" x2="480" y2="515" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-return)"/>
  <text x="490" y="519" font-size="10" fill="#475569">return path</text>
  <text x="700" y="519" font-size="10" font-weight="600" fill="#334155">Owns: scion0 + dedicated nftables table</text>
  <text x="700" y="535" font-size="10" fill="#64748b">Does not modify br-ex or the OVN database</text>
</svg>
