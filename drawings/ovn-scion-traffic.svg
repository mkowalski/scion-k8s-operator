<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#16a34a"/></marker>
    <marker id="purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#7c3aed"/></marker>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2563eb"/></marker>
    <marker id="gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">OVN-Kubernetes → SCION: destination-only routing, original source preserved</text>
  <rect x="140" y="43" width="330" height="32" rx="16" fill="#fef3c7" stroke="#d97706"/><text x="305" y="64" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">routingViaHost = true</text>
  <rect x="500" y="43" width="360" height="32" rx="16" fill="#fef3c7" stroke="#d97706"/><text x="680" y="64" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Accepted default PodNetwork RouteAdvertisements</text>

  <rect x="25" y="95" width="610" height="465" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="42" y="119" font-size="13" font-weight="600" fill="#64748b">OpenShift node</text>

  <rect x="55" y="150" width="145" height="62" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/><text x="127" y="173" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">workload pod</text><text x="127" y="194" text-anchor="middle" font-size="10" fill="#1e3a8a">source 10.128.2.49</text>
  <rect x="55" y="285" width="145" height="62" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="127" y="308" text-anchor="middle" font-size="12" font-weight="600" fill="#075985">host process</text><text x="127" y="329" text-anchor="middle" font-size="10" fill="#075985">kernel source 10.128.2.2</text>

  <rect x="240" y="142" width="155" height="78" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="317" y="166" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">OVN local gateway</text><text x="317" y="186" text-anchor="middle" font-size="10" fill="#92400e">ovn-k8s-mp0 → host</text><text x="317" y="202" text-anchor="middle" font-size="9" fill="#92400e">pod source not masqueraded</text>
  <line x1="200" y1="181" x2="235" y2="181" stroke="#16a34a" stroke-width="2.5" marker-end="url(#green)"/>

  <rect x="435" y="142" width="170" height="92" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="520" y="166" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Linux routing table</text><text x="520" y="188" text-anchor="middle" font-size="9" fill="#334155">192.168.100.0/24 → scion0</text><text x="520" y="205" text-anchor="middle" font-size="9" fill="#334155">192.168.111.0/24 → underlay</text><text x="520" y="222" text-anchor="middle" font-size="9" fill="#334155">all others → normal uplink</text>
  <line x1="395" y1="181" x2="430" y2="181" stroke="#16a34a" stroke-width="2.5" marker-end="url(#green)"/>
  <path d="M200 316 C300 316, 350 220, 430 204" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#green)"/>

  <rect x="240" y="270" width="365" height="92" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/><text x="422" y="293" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">route decision</text><text x="422" y="313" text-anchor="middle" font-size="10" fill="#166534">learned remote prefix → scion0</text><text x="422" y="331" text-anchor="middle" font-size="10" fill="#475569">ordinary destination → normal uplink</text><text x="422" y="348" text-anchor="middle" font-size="10" fill="#b45309">acceptPolicy.underlayCIDRs → normal uplink (never SCION)</text>
  <line x1="520" y1="234" x2="490" y2="265" stroke="#16a34a" stroke-width="2.5" marker-end="url(#green)"/>

  <rect x="240" y="405" width="365" height="112" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="422" y="429" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">scion-node-agent / embedded SIG</text>
  <rect x="265" y="447" width="125" height="38" rx="5" fill="#bbf7d0" stroke="#16a34a"/><text x="327" y="470" text-anchor="middle" font-size="11" fill="#166534">scion0 tun</text>
  <rect x="410" y="447" width="170" height="38" rx="5" fill="#f0fdf4" stroke="#16a34a"/><text x="495" y="462" text-anchor="middle" font-size="10" fill="#166534">encapsulate inner IP</text><text x="495" y="476" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">source unchanged · no SNAT</text>
  <line x1="422" y1="362" x2="422" y2="400" stroke="#16a34a" stroke-width="2.5" marker-end="url(#green)"/>

  <path d="M520 142 C520 105, 605 105, 625 130" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#gray)"/><text x="531" y="103" font-size="9" fill="#475569">normal uplink: Internet + AS underlay</text>
  <rect x="50" y="495" width="165" height="43" rx="6" fill="#fff7ed" stroke="#fb923c"/><text x="132" y="512" text-anchor="middle" font-size="9" font-weight="600" fill="#9a3412">underlay invariant</text><text x="132" y="527" text-anchor="middle" font-size="9" fill="#9a3412">discovery · registrar · BR stay IP</text>

  <rect x="675" y="135" width="135" height="300" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="742" y="159" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">Local SCION AS</text>
  <rect x="690" y="190" width="105" height="58" rx="7" fill="#ddd6fe" stroke="#7c3aed"/><text x="742" y="213" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">border router</text><text x="742" y="232" text-anchor="middle" font-size="9" fill="#5b21b6">inter-AS data plane</text>
  <rect x="690" y="275" width="105" height="58" rx="7" fill="#ddd6fe" stroke="#7c3aed"/><text x="742" y="298" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">control service</text><text x="742" y="317" text-anchor="middle" font-size="9" fill="#5b21b6">SIG discovery</text>
  <rect x="690" y="360" width="105" height="48" rx="7" fill="#fff7ed" stroke="#fb923c"/><text x="742" y="380" text-anchor="middle" font-size="9" font-weight="600" fill="#9a3412">underlay endpoints</text><text x="742" y="395" text-anchor="middle" font-size="8" fill="#9a3412">excluded from scion0</text>
  <path d="M605 466 C655 466, 640 219, 685 219" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#purple)"/><text x="650" y="350" text-anchor="middle" font-size="9" font-weight="600" fill="#5b21b6" transform="rotate(-90 650 350)">SCION over UDP</text>

  <rect x="840" y="135" width="135" height="300" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="907" y="159" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">Remote AS</text>
  <rect x="855" y="190" width="105" height="58" rx="7" fill="#ddd6fe" stroke="#7c3aed"/><text x="907" y="213" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">remote SIG</text><text x="907" y="232" text-anchor="middle" font-size="9" fill="#5b21b6">decapsulates IP</text>
  <rect x="855" y="285" width="105" height="72" rx="7" fill="#dbeafe" stroke="#3b82f6"/><text x="907" y="308" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">remote target</text><text x="907" y="326" text-anchor="middle" font-size="9" fill="#1e3a8a">192.168.100.1</text><text x="907" y="343" text-anchor="middle" font-size="9" fill="#1e3a8a">ICMP + TCP :18080</text>
  <line x1="810" y1="219" x2="835" y2="219" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#purple)"/>
  <line x1="907" y1="248" x2="907" y2="280" stroke="#16a34a" stroke-width="2.5" marker-end="url(#green)"/>

  <path d="M907 357 C907 520, 700 570, 535 517" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#blue)"/>
  <path d="M240 485 C185 550, 42 525, 42 181 L50 181" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#blue)"/>
  <rect x="620" y="510" width="320" height="25" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="780" y="527" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">return route follows the advertised original-source prefix</text>

  <line x1="55" y1="595" x2="85" y2="595" stroke="#16a34a" stroke-width="2.5" marker-end="url(#green)"/><text x="95" y="599" font-size="10" fill="#475569">inner IP, source preserved</text>
  <line x1="285" y1="595" x2="315" y2="595" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#purple)"/><text x="325" y="599" font-size="10" fill="#475569">SCION-encapsulated UDP</text>
  <line x1="540" y1="595" x2="570" y2="595" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#blue)"/><text x="580" y="599" font-size="10" fill="#475569">return path</text>
  <text x="760" y="599" font-size="10" font-weight="600" fill="#334155">Owns only scion0 + learned routes</text>
  <text x="760" y="617" font-size="9" fill="#64748b">No SNAT · no egress pool · no OVN writes</text>
</svg>
