<svg xmlns="http://www.w3.org/2000/svg" width="980" height="610" viewBox="0 0 980 610" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#475569"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#16a34a"/></marker>
    <marker id="purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="980" height="610" fill="#ffffff"/>
  <text x="490" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">scion-k8s-operator — as-built component architecture</text>

  <rect x="25" y="48" width="650" height="515" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="42" y="72" font-size="13" font-weight="600" fill="#64748b">OpenShift / Kubernetes cluster</text>

  <rect x="50" y="92" width="245" height="78" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="172" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">ScionNetwork / cluster</text>
  <text x="172" y="135" text-anchor="middle" font-size="10" fill="#991b1b">bootstrap · advertisement · acceptPolicy</text>
  <text x="172" y="152" text-anchor="middle" font-size="10" fill="#991b1b">underlayCIDRs · registrar · scheduling</text>

  <rect x="50" y="195" width="245" height="92" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="172" y="219" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">platform prerequisites (read-only)</text>
  <text x="172" y="240" text-anchor="middle" font-size="10" fill="#9a3412">Network: routingViaHost = true</text>
  <text x="172" y="258" text-anchor="middle" font-size="10" fill="#9a3412">RouteAdvertisements: Accepted</text>
  <text x="172" y="275" text-anchor="middle" font-size="10" fill="#9a3412">default PodNetwork advertised</text>

  <rect x="350" y="92" width="285" height="195" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="492" y="117" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">scion-operator Deployment</text>
  <text x="492" y="141" text-anchor="middle" font-size="10" fill="#92400e">reconcile DaemonSet · ServiceAccount · RBAC · SCC</text>
  <text x="492" y="160" text-anchor="middle" font-size="10" fill="#92400e">observe OVN prerequisites; never mutate OVN</text>
  <text x="492" y="179" text-anchor="middle" font-size="10" fill="#92400e">Available · Progressing · Degraded · node summary</text>
  <text x="492" y="198" text-anchor="middle" font-size="10" fill="#92400e">register current node SIG set; finalizer cleanup</text>
  <rect x="373" y="220" width="238" height="43" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="492" y="238" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">static install manifests</text>
  <text x="492" y="253" text-anchor="middle" font-size="9" fill="#92400e">ServiceMonitor · PrometheusRule · namespace</text>

  <line x1="295" y1="131" x2="345" y2="131" stroke="#475569" stroke-width="2" marker-end="url(#gray)"/><text x="320" y="122" text-anchor="middle" font-size="9" fill="#64748b">watches</text>
  <line x1="295" y1="241" x2="345" y2="190" stroke="#f97316" stroke-width="2" marker-end="url(#gray)"/><text x="315" y="210" text-anchor="middle" font-size="9" fill="#9a3412">observes</text>

  <rect x="50" y="326" width="585" height="205" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="342" y="350" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">scion-node-agent DaemonSet — every selected node</text>
  <text x="342" y="369" text-anchor="middle" font-size="10" fill="#166534">hostNetwork · privileged/root on RHCOS · system-node-critical</text>
  <rect x="70" y="390" width="155" height="62" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="147" y="412" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">bootstrap</text><text x="147" y="430" text-anchor="middle" font-size="9" fill="#166534">URL · DNS · DHCP · mDNS</text><text x="147" y="444" text-anchor="middle" font-size="9" fill="#166534">topology + TRCs + pins</text>
  <rect x="240" y="390" width="155" height="62" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="317" y="412" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">daemon</text><text x="317" y="430" text-anchor="middle" font-size="9" fill="#166534">paths + trust in-process</text><text x="317" y="444" text-anchor="middle" font-size="9" fill="#166534">standard API :30255</text>
  <rect x="410" y="390" width="205" height="62" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="512" y="412" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">embedded SIG</text><text x="512" y="430" text-anchor="middle" font-size="9" fill="#166534">scion0 · SGRP · exact learned routes</text><text x="512" y="444" text-anchor="middle" font-size="9" fill="#166534">source preserved · no SNAT</text>
  <line x1="225" y1="421" x2="235" y2="421" stroke="#475569" marker-end="url(#gray)"/><line x1="395" y1="421" x2="405" y2="421" stroke="#475569" marker-end="url(#gray)"/>
  <rect x="70" y="472" width="545" height="40" rx="6" fill="#ecfdf5" stroke="#86efac"/>
  <text x="342" y="489" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">guardrails: cluster + service + forbidden + underlay CIDRs never select scion0</text>
  <text x="342" y="503" text-anchor="middle" font-size="9" fill="#166534">advertise pod CIDR · optional safe node IP · normal routes remain untouched</text>
  <line x1="492" y1="287" x2="492" y2="321" stroke="#475569" stroke-width="2" marker-end="url(#gray)"/><text x="504" y="310" font-size="9" fill="#64748b">manages</text>

  <rect x="705" y="70" width="245" height="420" rx="11" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="827" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#5b21b6">local SCION AS infrastructure</text>
  <rect x="725" y="120" width="205" height="52" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="827" y="141" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">discovery service</text><text x="827" y="158" text-anchor="middle" font-size="9" fill="#5b21b6">topology.json + TRCs</text>
  <rect x="725" y="190" width="205" height="58" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="827" y="212" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">scion-registrar</text><text x="827" y="229" text-anchor="middle" font-size="9" fill="#5b21b6">PUT /v1/sigs · patch + SIGHUP</text><text x="827" y="241" text-anchor="middle" font-size="8" fill="#7c3aed">manual | HTTP | Anapaya stub</text>
  <rect x="725" y="268" width="205" height="52" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="827" y="289" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">control service</text><text x="827" y="306" text-anchor="middle" font-size="9" fill="#5b21b6">paths · trust · SIG discovery</text>
  <rect x="725" y="340" width="205" height="52" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="827" y="361" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">border router</text><text x="827" y="378" text-anchor="middle" font-size="9" fill="#5b21b6">node ↔ inter-AS data plane</text>
  <ellipse cx="827" cy="445" rx="100" ry="27" fill="#ddd6fe" stroke="#7c3aed"/><text x="827" y="450" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">SCION network</text>

  <path d="M635 175 C675 175 685 220 720 220" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#gray)"/><text x="678" y="190" font-size="9" fill="#64748b">registrar API</text>
  <path d="M70 421 L35 421 L35 545 L682 545 L682 146 L720 146" fill="none" stroke="#475569" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#gray)"/><text x="600" y="539" font-size="9" fill="#64748b">HTTP bootstrap</text>
  <path d="M615 421 C665 421 675 366 720 366" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#purple)"/><text x="665" y="406" font-size="9" fill="#5b21b6">SCION/UDP</text>
  <line x1="827" y1="392" x2="827" y2="416" stroke="#7c3aed" stroke-width="2" marker-end="url(#purple)"/>

  <rect x="120" y="575" width="740" height="24" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="490" y="591" text-anchor="middle" font-size="10" fill="#1d4ed8">Ownership boundary: operator/agent own scion0 and Kubernetes dependents; OVN and AS routing remain administrator-owned</text>
</svg>
