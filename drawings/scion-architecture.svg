<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="470" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Component architecture</text>

  <!-- cluster boundary -->
  <rect x="30" y="45" width="600" height="395" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="45" y="68" font-size="13" font-weight="600" fill="#64748b">OpenShift / Kubernetes cluster</text>

  <!-- CRD -->
  <rect x="60" y="90" width="200" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="160" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">ScionNetwork CRD</text>
  <text x="160" y="134" text-anchor="middle" font-size="11" fill="#991b1b">cluster-scoped singleton</text>

  <!-- operator -->
  <rect x="330" y="90" width="270" height="88" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="465" y="113" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">scion-operator (Deployment)</text>
  <text x="465" y="132" text-anchor="middle" font-size="11" fill="#92400e">reconciles DaemonSet, RBAC, SCC</text>
  <text x="465" y="148" text-anchor="middle" font-size="11" fill="#92400e">status conditions, isdAS</text>
  <text x="465" y="164" text-anchor="middle" font-size="11" fill="#92400e">registrar controller (manual | http | anapaya)</text>

  <line x1="260" y1="120" x2="325" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="292" y="112" text-anchor="middle" font-size="10" fill="#64748b">watches</text>

  <!-- daemonset agents -->
  <rect x="60" y="215" width="540" height="200" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="330" y="238" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">scion-node-agent DaemonSet &#8212; every node, hostNetwork, NET_ADMIN</text>

  <!-- one node agent expanded -->
  <g>
    <rect x="80" y="255" width="480" height="140" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="320" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">per-node agent</text>
    <rect x="95" y="290" width="130" height="42" rx="5" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="160" y="308" text-anchor="middle" font-size="11" fill="#166534">bootstrap</text>
    <text x="160" y="323" text-anchor="middle" font-size="10" fill="#166534">topology + TRCs</text>
    <rect x="245" y="290" width="140" height="42" rx="5" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="315" y="308" text-anchor="middle" font-size="11" fill="#166534">daemon module</text>
    <text x="315" y="323" text-anchor="middle" font-size="10" fill="#166534">paths, trust, :30255</text>
    <rect x="405" y="290" width="140" height="42" rx="5" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="475" y="308" text-anchor="middle" font-size="11" fill="#166534">gateway (SIG)</text>
    <text x="475" y="323" text-anchor="middle" font-size="10" fill="#166534">scion0 tun, SGRP</text>
    <line x1="225" y1="311" x2="240" y2="311" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <line x1="385" y1="311" x2="400" y2="311" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <rect x="95" y="345" width="450" height="34" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="4 3"/>
    <text x="320" y="366" text-anchor="middle" font-size="11" fill="#166534">host routes: remote SCION prefixes &#8594; scion0 &#183; advertises pod CIDR + node IP</text>
  </g>

  <line x1="465" y1="178" x2="465" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="478" y="199" font-size="10" fill="#64748b">manages</text>

  <!-- AS infrastructure -->
  <rect x="680" y="90" width="230" height="180" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="795" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#5b21b6">SCION AS infrastructure</text>
  <rect x="700" y="130" width="190" height="36" rx="6" fill="#ddd6fe" stroke="#7c3aed"/>
  <text x="795" y="153" text-anchor="middle" font-size="11" fill="#5b21b6">control service + border router</text>
  <rect x="700" y="178" width="190" height="50" rx="6" fill="#ddd6fe" stroke="#7c3aed"/>
  <text x="795" y="198" text-anchor="middle" font-size="11" fill="#5b21b6">scion-registrar</text>
  <text x="795" y="214" text-anchor="middle" font-size="10" fill="#5b21b6">patches topology.json sigs, SIGHUP</text>
  <text x="795" y="252" text-anchor="middle" font-size="10" fill="#5b21b6">(OSS AS &#183; Anapaya EDGE &#183; SCIONLab)</text>

  <!-- registrar sync -->
  <line x1="600" y1="140" x2="695" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="640" y="152" font-size="10" fill="#64748b">PUT /v1/sigs</text>

  <!-- dataplane to SCION -->
  <ellipse cx="795" cy="380" rx="120" ry="40" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="795" y="378" text-anchor="middle" font-size="13" font-weight="600" fill="#5b21b6">SCION network</text>
  <text x="795" y="396" text-anchor="middle" font-size="11" fill="#5b21b6">path-aware inter-domain</text>

  <line x1="560" y1="360" x2="672" y2="376" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="612" y="352" font-size="10" fill="#166534" font-weight="600">IP-in-SCION (UDP)</text>
  <line x1="795" y1="270" x2="795" y2="338" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow2)"/>
</svg>
