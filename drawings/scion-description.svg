<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#475569"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="940" height="560" fill="#ffffff"/>
  <text x="230" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Classic external gateway</text>
  <text x="710" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Per-node SCION endhost</text>

  <rect x="45" y="55" width="370" height="170" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="230" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">Kubernetes node</text>
  <rect x="75" y="100" width="90" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="120" y="127" text-anchor="middle" font-size="12" fill="#1e3a8a">pod</text>
  <rect x="180" y="100" width="90" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="225" y="127" text-anchor="middle" font-size="12" fill="#1e3a8a">pod</text>
  <rect x="75" y="165" width="310" height="38" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="230" y="189" text-anchor="middle" font-size="11" fill="#334155">ordinary IP routing</text>
  <line x1="230" y1="225" x2="230" y2="258" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="242" y="249" font-size="10" fill="#64748b">plain IP</text>
  <rect x="80" y="263" width="300" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="230" y="291" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">external SIG / Anapaya EDGE</text>
  <text x="230" y="312" text-anchor="middle" font-size="10" fill="#92400e">IP-in-SCION encapsulation</text>
  <line x1="230" y1="333" x2="230" y2="368" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="105" y="373" width="250" height="55" rx="8" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="230" y="397" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">AS border router</text><text x="230" y="414" text-anchor="middle" font-size="10" fill="#5b21b6">stays in AS infrastructure</text>
  <line x1="230" y1="428" x2="230" y2="462" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <ellipse cx="230" cy="497" rx="155" ry="31" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="230" y="502" text-anchor="middle" font-size="13" font-weight="600" fill="#5b21b6">SCION network</text>

  <line x1="430" y1="280" x2="505" y2="280" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="467" y="258" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">move daemon + SIG</text>
  <text x="467" y="300" text-anchor="middle" font-size="10" fill="#64748b">BR remains AS-side</text>

  <rect x="525" y="55" width="370" height="305" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="710" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">OpenShift / Kubernetes node</text>
  <rect x="550" y="100" width="90" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="595" y="127" text-anchor="middle" font-size="12" fill="#1e3a8a">pod</text>
  <rect x="655" y="100" width="90" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6"/><text x="700" y="127" text-anchor="middle" font-size="12" fill="#1e3a8a">pod</text>
  <rect x="760" y="100" width="105" height="45" rx="6" fill="#e0f2fe" stroke="#0284c7"/><text x="812" y="127" text-anchor="middle" font-size="11" fill="#075985">host process</text>
  <rect x="550" y="162" width="315" height="46" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="707" y="181" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">OVN local gateway + Linux routing</text>
  <text x="707" y="197" text-anchor="middle" font-size="10" fill="#92400e">only learned destinations select scion0</text>
  <line x1="595" y1="145" x2="620" y2="158" stroke="#16a34a" stroke-width="2" marker-end="url(#green)"/>
  <line x1="700" y1="145" x2="700" y2="158" stroke="#16a34a" stroke-width="2" marker-end="url(#green)"/>
  <line x1="812" y1="145" x2="790" y2="158" stroke="#16a34a" stroke-width="2" marker-end="url(#green)"/>
  <rect x="550" y="225" width="315" height="108" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="707" y="248" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">scion-node-agent (privileged DaemonSet)</text>
  <rect x="568" y="263" width="125" height="30" rx="5" fill="#bbf7d0" stroke="#16a34a"/><text x="630" y="282" text-anchor="middle" font-size="10" fill="#166534">daemon: paths + trust</text>
  <rect x="710" y="263" width="137" height="30" rx="5" fill="#bbf7d0" stroke="#16a34a"/><text x="778" y="282" text-anchor="middle" font-size="10" fill="#166534">SIG: scion0 + SGRP</text>
  <text x="707" y="314" text-anchor="middle" font-size="10" fill="#166534">advertise pod CIDR · node IP only when safe · no SNAT</text>
  <line x1="707" y1="208" x2="707" y2="221" stroke="#16a34a" stroke-width="2" marker-end="url(#green)"/>
  <line x1="710" y1="360" x2="710" y2="378" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="724" y="374" font-size="10" fill="#64748b">SCION over UDP</text>
  <rect x="585" y="383" width="250" height="55" rx="8" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="710" y="407" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">AS border router</text><text x="710" y="424" text-anchor="middle" font-size="10" fill="#5b21b6">inter-AS forwarding remains AS-side</text>
  <line x1="710" y1="438" x2="710" y2="462" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <ellipse cx="710" cy="497" rx="155" ry="31" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="710" y="502" text-anchor="middle" font-size="13" font-weight="600" fill="#5b21b6">SCION network</text>
  <rect x="545" y="525" width="330" height="23" rx="11" fill="#ecfdf5" stroke="#86efac"/><text x="710" y="541" text-anchor="middle" font-size="10" fill="#166534">underlayCIDRs and ordinary traffic keep the normal route</text>
</svg>
