<svg xmlns="http://www.w3.org/2000/svg" width="940" height="530" viewBox="0 0 940 530" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- titles -->
  <text x="230" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Classic deployment</text>
  <text x="700" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">With scion-k8s-operator</text>

  <!-- ================= LEFT: classic ================= -->
  <!-- node -->
  <rect x="60" y="55" width="340" height="150" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="230" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">Kubernetes node</text>
  <rect x="85" y="95" width="80" height="46" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="125" y="122" text-anchor="middle" font-size="12" fill="#1e3a8a">pod</text>
  <rect x="180" y="95" width="80" height="46" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="220" y="122" text-anchor="middle" font-size="12" fill="#1e3a8a">pod</text>
  <rect x="85" y="152" width="290" height="36" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="230" y="175" text-anchor="middle" font-size="12" fill="#334155">eth0 &#8212; plain IP</text>

  <!-- link down -->
  <line x1="230" y1="205" x2="230" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="228" font-size="11" fill="#64748b">IP</text>

  <!-- external SIG appliance -->
  <rect x="90" y="243" width="280" height="66" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="230" y="269" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">External SCION gateway appliance</text>
  <text x="230" y="288" text-anchor="middle" font-size="11" fill="#92400e">(SIG / Anapaya EDGE &#8212; IP-in-SCION tunneling)</text>

  <!-- link to BR -->
  <line x1="230" y1="309" x2="230" y2="342" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="330" font-size="11" fill="#64748b">SCION over UDP</text>

  <!-- border router -->
  <rect x="115" y="345" width="230" height="50" rx="8" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="230" y="366" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">AS border router</text>
  <text x="230" y="383" text-anchor="middle" font-size="10" fill="#5b21b6">forwards between ASes</text>

  <!-- link to SCION -->
  <line x1="230" y1="395" x2="230" y2="428" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="417" font-size="11" fill="#64748b">inter-AS links</text>

  <!-- SCION cloud -->
  <ellipse cx="230" cy="465" rx="150" ry="32" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="230" y="470" text-anchor="middle" font-size="13" font-weight="600" fill="#5b21b6">SCION network (other ISDs / ASes)</text>

  <!-- ================= transition arrow ================= -->
  <line x1="425" y1="240" x2="510" y2="240" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="467" y="222" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="600">SIG moved</text>
  <text x="467" y="262" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="600">inside the node</text>
  <text x="467" y="282" text-anchor="middle" font-size="10" fill="#64748b">(border router stays</text>
  <text x="467" y="296" text-anchor="middle" font-size="10" fill="#64748b">in the AS infrastructure)</text>

  <!-- ================= RIGHT: operator ================= -->
  <!-- node -->
  <rect x="530" y="55" width="340" height="265" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="700" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">Kubernetes node</text>
  <rect x="555" y="95" width="80" height="46" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="595" y="122" text-anchor="middle" font-size="12" fill="#1e3a8a">pod</text>
  <rect x="650" y="95" width="80" height="46" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="690" y="122" text-anchor="middle" font-size="12" fill="#1e3a8a">pod</text>

  <!-- agent -->
  <rect x="555" y="160" width="290" height="112" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="700" y="182" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">scion-node-agent (DaemonSet)</text>
  <rect x="570" y="195" width="120" height="30" rx="5" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="630" y="214" text-anchor="middle" font-size="11" fill="#166534">SCION daemon</text>
  <rect x="705" y="195" width="125" height="30" rx="5" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="767" y="214" text-anchor="middle" font-size="11" fill="#166534">SCION-IP gateway</text>
  <rect x="570" y="233" width="260" height="28" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="4 3"/>
  <text x="700" y="251" text-anchor="middle" font-size="11" fill="#166534">scion0 tun &#8212; advertises pod CIDR + node IP (SGRP)</text>

  <!-- pods to agent -->
  <line x1="595" y1="141" x2="630" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="690" y1="141" x2="700" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- link to BR -->
  <line x1="700" y1="320" x2="700" y2="342" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="712" y="337" font-size="11" fill="#64748b">SCION over UDP</text>

  <!-- border router -->
  <rect x="585" y="345" width="230" height="50" rx="8" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="700" y="366" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">AS border router</text>
  <text x="700" y="383" text-anchor="middle" font-size="10" fill="#5b21b6">forwards between ASes</text>

  <!-- link to SCION -->
  <line x1="700" y1="395" x2="700" y2="428" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="712" y="417" font-size="11" fill="#64748b">inter-AS links</text>

  <!-- SCION cloud -->
  <ellipse cx="700" cy="465" rx="150" ry="32" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="700" y="470" text-anchor="middle" font-size="13" font-weight="600" fill="#5b21b6">SCION network (other ISDs / ASes)</text>
</svg>
