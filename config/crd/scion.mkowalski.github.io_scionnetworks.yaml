---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: scionnetworks.scion.mkowalski.github.io
spec:
  group: scion.mkowalski.github.io
  names:
    kind: ScionNetwork
    listKind: ScionNetworkList
    plural: scionnetworks
    singular: scionnetwork
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.isdAS
      name: ISD-AS
      type: string
    - jsonPath: .status.nodes.ready
      name: Ready
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ScionNetwork is the cluster-scoped singleton configuring SCION
          connectivity.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state.
            properties:
              acceptPolicy:
                description: AcceptPolicy controls which remote prefixes are accepted.
                properties:
                  forbiddenCIDRs:
                    description: |-
                      ForbiddenCIDRs are never accepted from remotes; the operator appends
                      clusterNetwork/serviceNetwork IPv4 ranges automatically. IPv6 ranges
                      are ignored because the policy engine is IPv4-only.
                    items:
                      pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$
                      type: string
                    type: array
                  isdASes:
                    description: ISDASes lists remote ISD-ASes to exchange prefixes
                      with.
                    items:
                      pattern: ^\d+-([0-9a-fA-F_:]+|\d+)$
                      type: string
                    minItems: 1
                    type: array
                  underlayCIDRs:
                    description: |-
                      UnderlayCIDRs are never accepted from remotes and keep cluster-to-AS
                      transport reachable outside the SCION tunnel.
                    items:
                      pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$
                      type: string
                    type: array
                required:
                - isdASes
                type: object
              advertisement:
                description: Advertisement controls which local prefixes are advertised.
                properties:
                  nodeIP:
                    default: false
                    description: |-
                      NodeIP enables advertising each node's IP address. Disabled by
                      default: when node IPs share the network that carries the SCION
                      tunnel traffic (the underlay), advertising them makes remote ASes
                      route the underlay into the tunnel, causing a routing loop. Enable
                      only when node IPs are disjoint from the underlay or the remote
                      side excludes it (see spec.acceptPolicy.underlayCIDRs).
                    type: boolean
                  podCIDR:
                    default: true
                    description: PodCIDR enables advertising each node's pod CIDR.
                    type: boolean
                type: object
              agentImage:
                description: AgentImage overrides the default agent image (set by
                  operator build).
                type: string
              bootstrap:
                description: Bootstrap configures SCION AS discovery for node agents.
                properties:
                  dhcpInterface:
                    description: DHCPInterface is the network interface used for DHCP-based
                      discovery.
                    type: string
                  discoveryURL:
                    description: DiscoveryURL is the bootstrap server URL; required
                      when mode is url.
                    type: string
                  dnsDomain:
                    description: DNSDomain is the search domain used for DNS-based
                      discovery.
                    type: string
                  mode:
                    description: Mode selects the bootstrap discovery mechanism.
                    enum:
                    - url
                    - dns
                    - dhcp
                    - mdns
                    type: string
                  refreshInterval:
                    default: 1h
                    description: RefreshInterval is how often the bootstrap data is
                      refreshed.
                    pattern: ^[0-9]+(ns|us|µs|ms|s|m|h)([0-9]+(ns|us|µs|ms|s|m|h))*$
                    type: string
                  secretRef:
                    description: |-
                      SecretRef optionally names a Secret mounted as pinned TRCs; keys
                      must be TRC filenames (e.g. ISD1-B1-S1.trc). Authenticated bootstrap
                      is not yet implemented.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                required:
                - mode
                type: object
                x-kubernetes-validations:
                - message: discoveryURL required when mode is url
                  rule: self.mode != 'url' || (has(self.discoveryURL) && size(self.discoveryURL)
                    > 0)
              dataplane:
                description: Dataplane configures the node-local SCION dataplane.
                properties:
                  tunName:
                    default: scion0
                    description: TunName is the name of the TUN device created on
                      each node.
                    type: string
                type: object
              nodeSelector:
                additionalProperties:
                  type: string
                description: NodeSelector limits which nodes run the agent DaemonSet.
                type: object
              registrar:
                description: Registrar configures SIG endpoint registration.
                properties:
                  backend:
                    default: manual
                    description: Backend selects the registration mechanism.
                    enum:
                    - manual
                    - http
                    - anapaya
                    type: string
                  credentialsSecretRef:
                    description: CredentialsSecretRef holds credentials for the registration
                      backend.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  endpoint:
                    description: Endpoint is the registration API endpoint for http/anapaya
                      backends.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: endpoint required when backend is not manual
                  rule: self.backend == 'manual' || (has(self.endpoint) && size(self.endpoint)
                    > 0)
              tolerations:
                description: Tolerations are applied to the agent DaemonSet pods.
                items:
                  description: |-
                    The pod this Toleration is attached to tolerates any taint that matches
                    the triple <key,value,effect> using the matching operator <operator>.
                  properties:
                    effect:
                      description: |-
                        Effect indicates the taint effect to match. Empty means match all taint effects.
                        When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: |-
                        Key is the taint key that the toleration applies to. Empty means match all taint keys.
                        If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                      type: string
                    operator:
                      description: |-
                        Operator represents a key's relationship to the value.
                        Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                        Exists is equivalent to wildcard for value, so that a pod can
                        tolerate all taints of a particular category.
                        Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                      type: string
                    tolerationSeconds:
                      description: |-
                        TolerationSeconds represents the period of time the toleration (which must be
                        of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                        it is not set, which means tolerate the taint forever (do not evict). Zero and
                        negative values will be treated as 0 (evict immediately) by the system.
                      format: int64
                      type: integer
                    value:
                      description: |-
                        Value is the taint value the toleration matches to.
                        If the operator is Exists, the value should be empty, otherwise just a regular string.
                      type: string
                  type: object
                type: array
            required:
            - acceptPolicy
            - bootstrap
            type: object
          status:
            description: Status is the observed state.
            properties:
              conditions:
                description: Conditions represent the current state of the ScionNetwork.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              isdAS:
                description: ISDAS is the local ISD-AS discovered via bootstrap.
                type: string
              nodes:
                description: Nodes summarizes agent readiness across nodes.
                properties:
                  degraded:
                    description: Degraded lists nodes whose agent is not ready.
                    items:
                      type: string
                    type: array
                  ready:
                    description: Ready is the number of nodes with a ready agent.
                    format: int32
                    type: integer
                  total:
                    description: Total is the number of nodes that should run an agent.
                    format: int32
                    type: integer
                required:
                - ready
                - total
                type: object
              registrar:
                description: Registrar reports SIG registration state.
                properties:
                  desiredSIGs:
                    description: DesiredSIGs is published for backend=manual so AS
                      operators can copy it.
                    items:
                      type: string
                    type: array
                  lastError:
                    description: LastError is the most recent registration error,
                      if any.
                    type: string
                  lastSyncTime:
                    description: LastSyncTime is the last time registration was synced.
                    format: date-time
                    type: string
                  registeredNodes:
                    description: RegisteredNodes is the number of nodes successfully
                      registered.
                    format: int32
                    type: integer
                type: object
            type: object
        type: object
        x-kubernetes-validations:
        - message: ScionNetwork is a singleton; metadata.name must be 'cluster'
          rule: self.metadata.name == 'cluster'
    served: true
    storage: true
    subresources:
      status: {}
