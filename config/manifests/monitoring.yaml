apiVersion: v1
kind: Service
metadata:
  name: scion-node-agent-metrics
  namespace: scion-system
  labels:
    app: scion-node-agent
  annotations:
    # On OpenShift, service-ca issues a serving certificate into this
    # secret; the operator mounts it into the agent DaemonSet, which then
    # serves authenticated HTTPS metrics (TokenReview + SAR on /metrics).
    # Harmless on vanilla Kubernetes (no service-ca: annotation ignored,
    # agent serves plaintext without auth).
    service.beta.openshift.io/serving-cert-secret-name: scion-node-agent-metrics-tls
spec:
  selector:
    app: scion-node-agent
  ports:
    - name: metrics
      port: 9465
      targetPort: 9465
---
apiVersion: v1
kind: Service
metadata:
  name: scion-operator-metrics
  namespace: scion-system
  labels:
    app: scion-operator
spec:
  selector:
    app: scion-operator
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: scion-node-agent
  namespace: scion-system
  labels:
    app: scion-node-agent
spec:
  selector:
    matchLabels:
      app: scion-node-agent
  endpoints:
    - port: metrics
      interval: 30s
      scheme: https
      tlsConfig:
        # service-ca bundle, auto-injected into every namespace.
        ca:
          configMap:
            name: openshift-service-ca.crt
            key: service-ca.crt
        # The scrape target is the node IP (hostNetwork); the certificate
        # is issued for the Service DNS name.
        serverName: scion-node-agent-metrics.scion-system.svc
      authorization:
        type: Bearer
        credentials:
          name: scion-metrics-reader-token
          key: token
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: scion-operator
  namespace: scion-system
  labels:
    app: scion-operator
spec:
  selector:
    matchLabels:
      app: scion-operator
  endpoints:
    - port: metrics
      interval: 30s
---
# Scraper identity: the agent authorizes any token whose subject may `get`
# the /metrics non-resource URL. Prometheus presents this ServiceAccount's
# token (referenced by the ServiceMonitor above).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scion-metrics-reader
  namespace: scion-system
  labels:
    app: scion-node-agent
---
apiVersion: v1
kind: Secret
metadata:
  name: scion-metrics-reader-token
  namespace: scion-system
  labels:
    app: scion-node-agent
  annotations:
    kubernetes.io/service-account.name: scion-metrics-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scion-metrics-reader
  labels:
    app: scion-node-agent
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scion-metrics-reader
  labels:
    app: scion-node-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: scion-metrics-reader
subjects:
  - kind: ServiceAccount
    name: scion-metrics-reader
    namespace: scion-system
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: scion
  namespace: scion-system
  labels:
    app: scion-operator
spec:
  groups:
    - name: scion
      rules:
        # Caveat: kube_daemonset_status_number_unavailable comes from the
        # platform kube-state-metrics. On OpenShift with user-workload
        # monitoring (UWM), the UWM ruler evaluates rules only against UWM
        # metrics and may not see platform metrics, so this alert can be
        # silently inert there. ScionNodeAgentAbsent below is the UWM-safe
        # fallback based on our own scrape targets.
        - alert: ScionNodeAgentDown
          expr: kube_daemonset_status_number_unavailable{daemonset="scion-node-agent",namespace="scion-system"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "SCION node agent unavailable on {{ $value }} node(s)"
        # UWM-safe: fires when no scion-node-agent target is scraped at all.
        # The job label equals the Service name (scion-node-agent-metrics),
        # the Prometheus Operator default.
        - alert: ScionNodeAgentAbsent
          expr: absent(up{job="scion-node-agent-metrics"}) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "No SCION node agent metrics targets are being scraped"
        - alert: ScionNetworkDegraded
          expr: max(scion_operator_scionnetwork_degraded) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ScionNetwork is Degraded"
