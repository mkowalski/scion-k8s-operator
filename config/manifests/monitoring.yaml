apiVersion: v1
kind: Service
metadata:
  name: scion-node-agent-metrics
  namespace: scion-system
  labels:
    app: scion-node-agent
spec:
  selector:
    app: scion-node-agent
  ports:
    - name: metrics
      port: 9465
      targetPort: 9465
---
apiVersion: v1
kind: Service
metadata:
  name: scion-operator-metrics
  namespace: scion-system
  labels:
    app: scion-operator
spec:
  selector:
    app: scion-operator
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: scion-node-agent
  namespace: scion-system
  labels:
    app: scion-node-agent
spec:
  selector:
    matchLabels:
      app: scion-node-agent
  endpoints:
    - port: metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: scion-operator
  namespace: scion-system
  labels:
    app: scion-operator
spec:
  selector:
    matchLabels:
      app: scion-operator
  endpoints:
    - port: metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: scion
  namespace: scion-system
  labels:
    app: scion-operator
spec:
  groups:
    - name: scion
      rules:
        - alert: ScionNodeAgentDown
          expr: kube_daemonset_status_number_unavailable{daemonset="scion-node-agent",namespace="scion-system"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "SCION node agent unavailable on {{ $value }} node(s)"
        - alert: ScionNetworkDegraded
          expr: max(scion_operator_scionnetwork_degraded) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ScionNetwork is Degraded"
