apiVersion: apps/v1
kind: Deployment
metadata:
  name: scion-operator
  namespace: scion-system
  labels:
    app: scion-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scion-operator
  template:
    metadata:
      labels:
        app: scion-operator
    spec:
      serviceAccountName: scion-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: quay.io/mkowalski/scion-operator:0.1.0-dev
          env:
            - name: AGENT_IMAGE
              value: quay.io/mkowalski/scion-node-agent:0.1.0-dev
          ports:
            - name: metrics
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
