apiVersion: v1
kind: ServiceAccount
metadata:
  name: scion-operator
  namespace: scion-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scion-operator
rules:
  # Own API.
  - apiGroups: ["scion.mkowalski.github.io"]
    resources: ["scionnetworks", "scionnetworks/status", "scionnetworks/finalizers"]
    verbs: ["*"]
  # Agent DaemonSet (operator-managed).
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Agent ServiceAccount and the scion-system Namespace (create-if-absent,
  # label merge).
  - apiGroups: [""]
    resources: ["serviceaccounts", "namespaces"]
    verbs: ["create", "get", "list", "watch", "update", "patch"]
  # Agent RBAC. Kubernetes escalation prevention requires the operator to
  # hold every permission it grants: the agent ClusterRole contains nodes
  # get plus tokenreviews/subjectaccessreviews create (metrics scraper
  # auth), all held by the operator below.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["create", "get", "list", "watch", "update", "patch"]
  # Held only so the agent ClusterRole granting them can be created
  # (escalation prevention); the operator itself never reviews tokens.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  # OpenShift SCC for the hostNetwork agent pods (no-op on vanilla k8s).
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Node watch (desired agent set) and agent pod status aggregation.
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  # OpenShift cluster networks: installed CIDRs and OVN gateway mode.
  - apiGroups: ["config.openshift.io", "operator.openshift.io"]
    resources: ["networks"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["k8s.ovn.org"]
    resources: ["routeadvertisements"]
    verbs: ["get", "list", "watch"]
  # Vanilla Kubernetes cluster-network derivation for the forbidden list.
  - apiGroups: ["networking.k8s.io"]
    resources: ["servicecidrs"]
    verbs: ["get", "list", "watch"]
  # Calico: IPPools feed the forbidden list; blockaffinities read is held
  # only so the agent ClusterRole granting it can be created (escalation
  # prevention) — the operator itself never reads them.
  - apiGroups: ["crd.projectcalico.org"]
    resources: ["ippools", "blockaffinities"]
    verbs: ["get", "list", "watch"]
  # Cilium: CiliumNode pod CIDRs feed the forbidden list; also granted to
  # the agent for its own discovery (escalation prevention).
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scion-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: scion-operator
subjects:
  - kind: ServiceAccount
    name: scion-operator
    namespace: scion-system
---
# Namespaced permissions: leader-election lease and the registrar
# credentials secret (spec.registrar.credentialsSecretRef) live in
# scion-system; no cluster-wide secret access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scion-operator
  namespace: scion-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Registrar credentials (read) and the operator-issued metrics serving
  # certificate + published CA (create/update on vanilla Kubernetes; on
  # OpenShift service-ca owns the secret contents).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scion-operator
  namespace: scion-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scion-operator
subjects:
  - kind: ServiceAccount
    name: scion-operator
    namespace: scion-system
