apiVersion: v1
kind: ServiceAccount
metadata:
  name: scion-operator
  namespace: scion-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scion-operator
rules:
  # Own API.
  - apiGroups: ["scion.mkowalski.github.io"]
    resources: ["scionnetworks", "scionnetworks/status", "scionnetworks/finalizers"]
    verbs: ["*"]
  # Agent DaemonSet (operator-managed).
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Agent ServiceAccount and the scion-system Namespace (create-if-absent,
  # label merge).
  - apiGroups: [""]
    resources: ["serviceaccounts", "namespaces"]
    verbs: ["create", "get", "list", "watch", "update", "patch"]
  # Agent RBAC. Kubernetes escalation prevention requires the operator to
  # hold every permission it grants: the agent ClusterRole only contains
  # nodes get/list/watch, which the operator holds below.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["create", "get", "list", "watch", "update", "patch"]
  # OpenShift SCC for the hostNetwork agent pods (no-op on vanilla k8s).
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Node watch (desired agent set) and agent pod status aggregation.
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  # OpenShift cluster networks: installed CIDRs and OVN gateway mode.
  - apiGroups: ["config.openshift.io", "operator.openshift.io"]
    resources: ["networks"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["k8s.ovn.org"]
    resources: ["routeadvertisements"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scion-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: scion-operator
subjects:
  - kind: ServiceAccount
    name: scion-operator
    namespace: scion-system
---
# Namespaced permissions: leader-election lease and the registrar
# credentials secret (spec.registrar.credentialsSecretRef) live in
# scion-system; no cluster-wide secret access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scion-operator
  namespace: scion-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scion-operator
  namespace: scion-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scion-operator
subjects:
  - kind: ServiceAccount
    name: scion-operator
    namespace: scion-system
